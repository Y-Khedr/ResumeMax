name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v

      - name: Scan dependencies for known vulnerabilities
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || echo "::warning::pip-audit found issues — review before deploying"
